[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tem-ip-ipnet"
version = "0.1.0"
description = "Cole-Cole to multi-Debye parameter mapping using a self-supervised IP-Net"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "jax>=0.4"]

[project.optional-dependencies]
train = ["torch>=2.0", "tqdm>=4.60", "matplotlib>=3.7"]
research = ["torch>=2.0", "scipy>=1.10", "matplotlib>=3.7", "tqdm>=4.60", "optuna>=3", "pandas>=2", "scikit-rf>=0.30", "jupyterlab>=4", "ipykernel>=6"]

[tool.setuptools.packages.find]
where = ["src"]
